<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tortue — a LOGO turtle, from MIT LISP LOGO to ES6</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🐢 tortue</h1>
  <p>MIT LISP LOGO (MACLISP, 1970s), translated to vanilla ES6 — SVG turtle graphics</p>
</header>
<main>
  <div class="editor-pane">
    <pre aria-hidden="true"><code id="highlight-layer"></code></pre>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
      >; tortue clock — a watch face with 12 ticks and a kite-shaped
; seconds hand, drawn with nothing but FORWARD, BACK, LEFT, and RIGHT —
; no SETXY, no SINE/COSINE, no absolute coordinates anywhere. The
; turtle's own heading IS the hand's angle: RIGHT 6 sweeps it one tick,
; and erasing is the exact reverse of painting (same vertices, opposite
; order, inverted turns/moves), so it always lands back on center with
; zero residual drift.

REPEAT 12 [
  PENUP FORWARD 240
  RIGHT 90 BACK 5 LEFT 90
  PENDOWN
  REPEAT 2 [ FORWARD 40 RIGHT 90 FORWARD 10 RIGHT 90 ]
  PENUP
  RIGHT 90 FORWARD 5 LEFT 90
  BACK 240 RIGHT 30
]

MAKE "DRAWN "FALSE

FOREVER [
  IF :DRAWN = "TRUE [
    PENERASE
    PENUP
    FORWARD 200
    RIGHT 4
    PENDOWN
    BACK 200
    LEFT 29
    BACK 33
    LEFT 130
    BACK 33
    LEFT 29
    BACK 200
    LEFT 176
    PENUP
    BACK 200
  ]
  PENPAINT
  RIGHT 6
  PENUP
  FORWARD 200
  PENDOWN
  RIGHT 176
  FORWARD 200
  RIGHT 29
  FORWARD 33
  RIGHT 130
  FORWARD 33
  RIGHT 29
  FORWARD 200
  PENUP
  LEFT 4
  BACK 200
  MAKE "DRAWN "TRUE
  SLEEP 0.994
]</textarea>
  </div>
  <svg id="canvas" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="controls">
    <button id="run">Run</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div id="output" aria-live="polite"></div>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
